profile:
  delivery_target: ENTERPRISE
  project_mode: BROWNFIELD
  assignment_scope:
    mode: FULL_PROJECT
    requested_scope:
    - scenario deliverable
    excluded_scope:
    - anything outside the scenario
    expected_deliverables:
    - validated result
    ownership_boundary:
    - local workspace
  nodes:
  - node: Qualification
    status: NOT_STARTED
    level: REQUIRED
    depth: FULL
    scope_role: SUPPORTING
    active_capabilities: []
    reused_artifacts: []
    gaps:
    - Qualification work
    reasons:
    - REQUIRED is required by the scenario
    external_project_requirement: null
  - node: Cognition
    status: NOT_STARTED
    level: REQUIRED
    depth: FULL
    scope_role: SUPPORTING
    active_capabilities: []
    reused_artifacts: []
    gaps:
    - Cognition work
    reasons:
    - REQUIRED is required by the scenario
    external_project_requirement: null
  - node: Product Definition & Scope
    status: NOT_STARTED
    level: REQUIRED
    depth: FULL
    scope_role: SUPPORTING
    active_capabilities: []
    reused_artifacts: []
    gaps:
    - Product Definition & Scope work
    reasons:
    - REQUIRED is required by the scenario
    external_project_requirement: null
  - node: Solution Design
    status: NOT_STARTED
    level: REQUIRED
    depth: FULL
    scope_role: SUPPORTING
    active_capabilities:
    - Evaluation Design
    reused_artifacts: []
    gaps:
    - Solution Design work
    reasons:
    - REQUIRED is required by the scenario
    external_project_requirement: null
  - node: Implementation
    status: NOT_STARTED
    level: REQUIRED
    depth: FULL
    scope_role: SUPPORTING
    active_capabilities: []
    reused_artifacts: []
    gaps:
    - Implementation work
    reasons:
    - REQUIRED is required by the scenario
    external_project_requirement: null
  - node: Validation & Iteration
    status: NOT_STARTED
    level: REQUIRED
    depth: FULL
    scope_role: SUPPORTING
    active_capabilities: []
    reused_artifacts: []
    gaps:
    - Validation & Iteration work
    reasons:
    - REQUIRED is required by the scenario
    external_project_requirement: null
  - node: Release & Operation
    status: NOT_STARTED
    level: REQUIRED
    depth: FULL
    scope_role: PRIMARY
    active_capabilities: []
    reused_artifacts: []
    gaps:
    - Release & Operation work
    - Monitoring evidence required before release
    reasons:
    - REQUIRED is required by the scenario
    external_project_requirement: null
  - node: Retrospective
    status: NOT_STARTED
    level: LIGHT
    depth: MINIMAL
    scope_role: SUPPORTING
    active_capabilities: []
    reused_artifacts: []
    gaps:
    - Retrospective work
    reasons:
    - LIGHT is required by the scenario
    external_project_requirement: null
  validation_context:
    existing_repository_modification: false
    verified_design: false
    acceptance_criteria_defined: false
    production_release: true
    monitoring_covered: false
    release_readiness: BLOCKED
    release_execution: false
plan:
  plan:
    version: v1
    objective: Deliver 06-enterprise-release
    tasks:
    - id: T1
      name: Task T1
      goal: Deliver 06-enterprise-release-definition
      type: WORK
      status: COMPLETED
      priority: P1
      lifecycle_node: Product Definition & Scope
      execution_depth: FULL
      dependencies: []
      required_inputs:
      - scope
      required_capabilities:
      - SKILL
      expected_output: 06-enterprise-release-definition
      acceptance_criteria:
      - 06-enterprise-release-definition is validated
      context_requirements: []
      artifact_requirements:
      - design-v1
      retry_policy: LOCAL_ONCE
    - id: T2
      name: Task T2
      goal: Deliver 06-enterprise-release-result
      type: WORK
      status: BLOCKED
      priority: P1
      lifecycle_node: Release & Operation
      execution_depth: FULL
      dependencies:
      - T1
      - Release Readiness
      required_inputs:
      - scope
      required_capabilities:
      - SKILL
      expected_output: 06-enterprise-release-result
      acceptance_criteria:
      - 06-enterprise-release-result is validated
      context_requirements: []
      artifact_requirements:
      - design-v1
      retry_policy: LOCAL_ONCE
    dependencies:
    - from: T1
      to: T2
      type: HARD
    - from: Release Readiness
      to: T2
      type: GATE
    critical_path:
    - T1
    - T2
    assumptions: []
  available_inputs:
  - scope
  artifacts:
  - id: design-v1
    type: DESIGN
    name: Verified design
    version: v1
    status: ACTIVE
    summary: Reusable design
    location: fixtures/design.md
    source_tasks: []
    source_records: []
    dependencies: []
  gates:
    Release Readiness: BLOCKED
  blocked_inputs: []
  write_targets:
    T1:
    - T1-artifact:v1
    T2:
    - T2-artifact:v1
